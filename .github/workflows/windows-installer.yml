name: WPOS PRO 2 Windows Installer

# Stage 4: starts after Windows Build completes. The gate fails unless Windows Build succeeded.
on:
  workflow_run:
    workflows: ["WPOS PRO 2 Windows Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: wpos-windows-installer-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate - Windows Build must succeed
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows Build result
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Windows Build conclusion: $UPSTREAM_CONCLUSION"
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "Windows Build did not succeed. Installer is stopped."
            exit 1
          fi

  installer:
    name: Build Windows Installer
    needs: gate
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Diagnose Windows runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Image: $env:ImageVersion"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve application version
        shell: pwsh
        run: |
          $version = python -c "from app.config import APP_VERSION; print(APP_VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "APP_VERSION bukan SemVer: $version" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building WPOS PRO 2 version $version"

      - name: Verify version consistency
        shell: pwsh
        run: |
          $config = Get-Content -Raw app\config.py
          $installer = Get-Content -Raw installer.iss
          if ($config -notmatch 'APP_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "APP_VERSION tidak ditemukan" }
          $configVersion = $Matches[1]
          if ($configVersion -ne $env:APP_VERSION) { throw "Versi config tidak konsisten" }
          if ($installer -notmatch '#define MyAppVersion\s+"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "MyAppVersion tidak ditemukan di installer.iss" }
          $installerVersion = $Matches[1]
          if ($installerVersion -ne $env:APP_VERSION) { throw "Versi installer ($installerVersion) != APP_VERSION ($env:APP_VERSION)" }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify branding assets
        shell: pwsh
        run: |
          if (!(Test-Path "assets\branding\wpos_logo.png")) { throw "Logo tidak ditemukan: wpos_logo.png" }
          if (!(Test-Path "assets\branding\wpos_icon.ico")) { throw "Icon tidak ditemukan: wpos_icon.ico" }
          if (!(Test-Path "assets\branding\login_background.png")) { throw "Background login tidak ditemukan: login_background.png" }

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --icon "assets\branding\wpos_icon.ico" --name "WPOS PRO 2" --paths . --add-data "assets\branding\wpos_logo.png;assets\branding" --add-data "assets\branding\wpos_icon.ico;assets\branding" --add-data "assets\branding\login_background.png;assets\branding" run.py

      - name: Verify EXE, icon and branding
        shell: pwsh
        run: |
          $exe = "dist\WPOS PRO 2\WPOS PRO 2.exe"
          $logo = "dist\WPOS PRO 2\_internal\assets\branding\wpos_logo.png"
          $icon = "dist\WPOS PRO 2\_internal\assets\branding\wpos_icon.ico"
          $background = "dist\WPOS PRO 2\_internal\assets\branding\login_background.png"
          if (!(Test-Path $exe)) { throw "EXE tidak ditemukan: $exe" }
          if (!(Test-Path $logo)) { throw "Logo tidak ikut dipaketkan: $logo" }
          if (!(Test-Path $icon)) { throw "Icon tidak ikut dipaketkan: $icon" }
          if (!(Test-Path $background)) { throw "Background login tidak ikut dipaketkan: $background" }
          Add-Type -AssemblyName System.Drawing
          $associated = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if ($null -eq $associated) { throw "EXE tidak memiliki associated icon" }
          $associated.Dispose()
          Copy-Item $exe "dist\WPOS_PRO_2_$env:APP_VERSION.exe"
          Get-FileHash "dist\WPOS_PRO_2_$env:APP_VERSION.exe" -Algorithm SHA256 | Format-List

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify installer and checksum
        shell: pwsh
        run: |
          $setup = "installer\WPOS_PRO_2_Setup_$env:APP_VERSION.exe"
          if (!(Test-Path $setup)) { throw "Installer tidak ditemukan: $setup" }
          if ((Get-Item $setup).Length -lt 100000) { throw "Installer terlalu kecil atau tidak valid" }
          $iss = Get-Content -Raw installer.iss
          if ($iss -notmatch 'SetupIconFile=assets\\branding\\wpos_icon\.ico') { throw "SetupIconFile tidak konsisten" }
          if ($iss -notmatch 'WPOS PRO 2\.exe') { throw "Nama EXE installer tidak konsisten" }
          if ($iss -notmatch [regex]::Escape($env:APP_VERSION)) { throw "Versi installer tidak ditemukan di installer.iss" }
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content "installer\SHA256SUMS.txt"
          Get-Item $setup | Format-List FullName,Length
          Get-Content "installer\SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-2-${{ env.APP_VERSION }}
          path: |
            dist/WPOS_PRO_2_${{ env.APP_VERSION }}.exe
            installer/WPOS_PRO_2_Setup_${{ env.APP_VERSION }}.exe
            installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
