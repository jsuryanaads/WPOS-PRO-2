name: WPOS PRO 2 Release Publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: V2.10
      RELEASE_VERSION: 2.10.0
      TARGET_SHA: 051487b7722c1247111098e8c28567a902e798dc
      BUILD_RUN_ID: "34711848194"
      ARTIFACT_NAME: WPOS-PRO-2-2.10.0
    steps:
      - name: Download verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release-assets
          test -f "release-assets/dist/WPOS_PRO_2_2.10.0.exe"
          test -f "release-assets/installer/WPOS_PRO_2_Setup_2.10.0.exe"
          test -f "release-assets/installer/SHA256SUMS.txt"
          cp "release-assets/dist/WPOS_PRO_2_2.10.0.exe" release-assets/WPOS_PRO_2_2.10.0.exe
          cp "release-assets/installer/WPOS_PRO_2_Setup_2.10.0.exe" release-assets/WPOS_PRO_2_Setup_2.10.0.exe
          cp "release-assets/installer/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          sha256sum release-assets/*.exe release-assets/SHA256SUMS.txt

      - name: Inspect existing release and tag
        id: inspect
        shell: bash
        run: |
          set +e
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId,isDraft,isPrerelease,isLatest,tagName,targetCommitish,assets 2>/tmp/release-error.txt)
          RELEASE_RC=$?
          TAG_JSON=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" 2>/tmp/tag-error.txt)
          TAG_RC=$?
          set -e
          echo "release_rc=$RELEASE_RC"
          echo "tag_rc=$TAG_RC"
          if [ "$RELEASE_RC" -eq 0 ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$RELEASE_JSON" > /tmp/release.json
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TAG_RC" -eq 0 ]; then echo "tag_exists=true" >> "$GITHUB_OUTPUT"; else echo "tag_exists=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$RELEASE_RC" -ne 0 ]; then cat /tmp/release-error.txt || true; fi
          if [ "$TAG_RC" -ne 0 ]; then cat /tmp/tag-error.txt || true; fi
          if [ "$RELEASE_RC" -eq 0 ]; then cat /tmp/release.json; fi
          if [ "$TAG_RC" -eq 0 ]; then printf '%s\n' "$TAG_JSON"; fi

      - name: Reject immutable release
        if: steps.inspect.outputs.release_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(jq -r '.isDraft' /tmp/release.json)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG already exists as a published release. Do not modify it automatically."
            exit 1
          fi

      - name: Create draft release on existing tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Pytest 132 passed; Windows EXE and installer verified."

      - name: Create draft release with GitHub-managed tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --target "$TARGET_SHA" --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Pytest 132 passed; Windows EXE and installer verified."

      - name: Upload assets to draft release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId,isDraft --jq '.databaseId + " " + (.isDraft|tostring)')
          set -- $RELEASE_ID
          RELEASE_ID="$1"
          IS_DRAFT="$2"
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG is not a draft. Refusing to upload to a published/immutable release."
            exit 1
          fi
          upload_asset() {
            local file="$1"
            local name="$2"
            local url="https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}"
            echo "Uploading ${name} to draft release ${RELEASE_ID}"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "$url" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${file}"
            echo
          }
          upload_asset "release-assets/WPOS_PRO_2_2.10.0.exe" "WPOS_PRO_2_2.10.0.exe"
          upload_asset "release-assets/WPOS_PRO_2_Setup_2.10.0.exe" "WPOS_PRO_2_Setup_2.10.0.exe"
          upload_asset "release-assets/SHA256SUMS.txt" "SHA256SUMS.txt"

      - name: Verify draft assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,isLatest,targetCommitish,assets
          for asset in WPOS_PRO_2_2.10.0.exe WPOS_PRO_2_Setup_2.10.0.exe SHA256SUMS.txt; do
            gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fx "$asset"
          done

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,isLatest,targetCommitish,assets
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fx 'WPOS_PRO_2_2.10.0.exe'
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fx 'WPOS_PRO_2_Setup_2.10.0.exe'
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'
