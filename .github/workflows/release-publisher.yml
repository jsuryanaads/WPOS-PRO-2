name: WPOS PRO 2 Release Publisher

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/release-publisher.yml
  workflow_run:
    workflows: ["WPOS PRO 2 Windows Installer"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Resolve latest successful installer
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api "repos/$REPO/actions/workflows/windows-installer.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          ARTIFACT_NAME="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("WPOS-PRO-2-")))] | .[0].name')"
          test -n "$ARTIFACT_NAME" && test "$ARTIFACT_NAME" != "null"
          VERSION="${ARTIFACT_NAME#WPOS-PRO-2-}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Installer run: $RUN_ID"
          echo "Artifact: $ARTIFACT_NAME"
          echo "Version: $VERSION"

      - name: Download existing installer artifact
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release-assets
          VERSION="${{ steps.resolve.outputs.version }}"
          test -f "release-assets/dist/WPOS_PRO_2_${VERSION}.exe"
          test -f "release-assets/installer/WPOS_PRO_2_Setup_${VERSION}.exe"
          test -f "release-assets/installer/SHA256SUMS.txt"
          cp "release-assets/dist/WPOS_PRO_2_${VERSION}.exe" release-assets/WPOS_PRO_2_${VERSION}.exe
          cp "release-assets/installer/WPOS_PRO_2_Setup_${VERSION}.exe" release-assets/WPOS_PRO_2_Setup_${VERSION}.exe
          cp "release-assets/installer/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum -c SHA256SUMS.txt

      - name: Create or update draft release
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="V$VERSION"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" = "true" || { echo "Release $TAG already published"; exit 1; }
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "WPOS PRO 2 v$VERSION" --notes "WPOS PRO 2 v$VERSION production release."
          fi

      - name: Upload release assets
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="V$VERSION"
          gh release upload "$TAG" \
            "release-assets/WPOS_PRO_2_${VERSION}.exe" \
            "release-assets/WPOS_PRO_2_Setup_${VERSION}.exe" \
            "release-assets/SHA256SUMS.txt" \
            --repo "$REPO" --clobber

      - name: Publish release
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="V$VERSION"
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets --jq '{draft:.isDraft, prerelease:.isPrerelease, assets:(.assets|length)}'
