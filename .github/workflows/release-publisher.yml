name: WPOS PRO 2 Release Publisher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WPOS_RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: V2.13.0
      RELEASE_VERSION: 2.13.0
      TARGET_SHA: 71d71d57bcc11ae710bad21667832e818d367265
      ARTIFACT_NAME: WPOS-PRO-2-2.13.0
    steps:
      - name: Validate release token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$REPO" --jq '.full_name' | grep -Fx "$REPO"

      - name: Wait for verified Windows Installer run
        id: resolve_installer
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Windows Installer for target SHA $TARGET_SHA"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_JSON=$(gh api "repos/$REPO/actions/workflows/windows-installer.yml/runs?head_sha=$TARGET_SHA&per_page=20")
            RUN_ID=$(echo "$RUN_JSON" | jq -r '.workflow_runs[] | select(.head_sha == "'"$TARGET_SHA"'") | .id' | head -n 1)
            if [ -n "$RUN_ID" ]; then
              STATUS=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
              CONCLUSION=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // ""')
              echo "Installer run $RUN_ID: status=$STATUS conclusion=$CONCLUSION attempt=$attempt"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" != "success" ]; then
                  echo "Windows Installer failed for target SHA $TARGET_SHA"
                  exit 1
                fi
                break
              fi
            else
              echo "Windows Installer run not created yet; attempt=$attempt"
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for Windows Installer run for $TARGET_SHA"
              exit 1
            fi
            sleep 10
          done
          test -n "$RUN_ID"
          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '{id, name, status, conclusion, head_sha, head_branch}'

      - name: Verify release artifact exists
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.resolve_installer.outputs.BUILD_RUN_ID }}
        run: |
          set -euo pipefail
          ARTIFACT_JSON=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN_ID/artifacts?name=$ARTIFACT_NAME&per_page=20")
          echo "$ARTIFACT_JSON"
          COUNT=$(echo "$ARTIFACT_JSON" | jq '.artifacts | length')
          test "$COUNT" -ge 1
          echo "$ARTIFACT_JSON" | jq -e --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false)' >/dev/null

      - name: Download verified Windows Installer artifact
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.resolve_installer.outputs.BUILD_RUN_ID }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release-assets
          test -f "release-assets/dist/WPOS_PRO_2_2.13.0.exe"
          test -f "release-assets/installer/WPOS_PRO_2_Setup_2.13.0.exe"
          test -f "release-assets/installer/SHA256SUMS.txt"
          cp "release-assets/dist/WPOS_PRO_2_2.13.0.exe" release-assets/WPOS_PRO_2_2.13.0.exe
          cp "release-assets/installer/WPOS_PRO_2_Setup_2.13.0.exe" release-assets/WPOS_PRO_2_Setup_2.13.0.exe
          cp "release-assets/installer/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          sha256sum release-assets/*.exe release-assets/SHA256SUMS.txt

      - name: Inspect existing release and tag
        id: inspect
        shell: bash
        run: |
          set +e
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId,isDraft,isPrerelease,tagName,targetCommitish,assets 2>/tmp/release-error.txt)
          RELEASE_RC=$?
          TAG_JSON=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" 2>/tmp/tag-error.txt)
          TAG_RC=$?
          set -e
          if [ "$RELEASE_RC" -eq 0 ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$RELEASE_JSON" > /tmp/release.json
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TAG_RC" -eq 0 ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RELEASE_RC" -ne 0 ]; then cat /tmp/release-error.txt || true; fi
          if [ "$TAG_RC" -ne 0 ]; then cat /tmp/tag-error.txt || true; fi

      - name: Reject published release
        if: steps.inspect.outputs.release_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(jq -r '.isDraft' /tmp/release.json)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG already exists as a published release. Refusing to modify it."
            exit 1
          fi

      - name: Create draft release on existing tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Visible premium UI refresh, responsive breakpoints, realtime dashboard, security hardening, purchase cost handling, receipt print safety, and RBAC hardening included. Windows EXE and installer verified."

      - name: Create draft release with GitHub-managed tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating draft release for tag $RELEASE_TAG at target $TARGET_SHA"
          gh release create "$RELEASE_TAG" --repo "$REPO" --target "$TARGET_SHA" --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Visible premium UI refresh, responsive breakpoints, realtime dashboard, security hardening, purchase cost handling, receipt print safety, and RBAC hardening included. Windows EXE and installer verified."

      - name: Upload assets to draft release
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG is not a draft. Refusing to upload assets."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "release-assets/WPOS_PRO_2_2.13.0.exe" \
            "release-assets/WPOS_PRO_2_Setup_2.13.0.exe" \
            "release-assets/SHA256SUMS.txt" \
            --repo "$REPO" --clobber

      - name: Verify draft assets and target
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,targetCommitish,assets)
          echo "$RELEASE_JSON"
          test "$(echo "$RELEASE_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"
          test "$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')" = "$TARGET_SHA"
          for asset in WPOS_PRO_2_2.13.0.exe WPOS_PRO_2_Setup_2.13.0.exe SHA256SUMS.txt; do
            echo "$RELEASE_JSON" | jq -r '.assets[].name' | grep -Fx "$asset"
          done

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --latest
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,targetCommitish,assets)
          echo "$RELEASE_JSON"
          test "$(echo "$RELEASE_JSON" | jq -r '.isDraft')" = "false"
          test "$(echo "$RELEASE_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"
          test "$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')" = "$TARGET_SHA"
          for asset in WPOS_PRO_2_2.13.0.exe WPOS_PRO_2_Setup_2.13.0.exe SHA256SUMS.txt; do
            echo "$RELEASE_JSON" | jq -r '.assets[].name' | grep -Fx "$asset"
          done
