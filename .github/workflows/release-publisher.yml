name: WPOS PRO 2 Release Publisher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WPOS_RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: V2.12.0
      RELEASE_VERSION: 2.12.0
      TARGET_SHA: f535c1ffec3dfaef1fa8c9b389542d1311218e6d
      BUILD_RUN_ID: "35116774752"
      ARTIFACT_NAME: WPOS-PRO-2-2.12.0
    steps:
      - name: Validate release token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$REPO" --jq '.full_name' | grep -Fx "$REPO"

      - name: Download verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release-assets
          test -f "release-assets/dist/WPOS_PRO_2_2.12.0.exe"
          test -f "release-assets/installer/WPOS_PRO_2_Setup_2.12.0.exe"
          test -f "release-assets/installer/SHA256SUMS.txt"
          cp "release-assets/dist/WPOS_PRO_2_2.12.0.exe" release-assets/WPOS_PRO_2_2.12.0.exe
          cp "release-assets/installer/WPOS_PRO_2_Setup_2.12.0.exe" release-assets/WPOS_PRO_2_Setup_2.12.0.exe
          cp "release-assets/installer/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          sha256sum release-assets/*.exe release-assets/SHA256SUMS.txt

      - name: Inspect existing release and tag
        id: inspect
        shell: bash
        run: |
          set +e
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId,isDraft,isPrerelease,tagName,targetCommitish,assets 2>/tmp/release-error.txt)
          RELEASE_RC=$?
          TAG_JSON=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" 2>/tmp/tag-error.txt)
          TAG_RC=$?
          set -e
          if [ "$RELEASE_RC" -eq 0 ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$RELEASE_JSON" > /tmp/release.json
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TAG_RC" -eq 0 ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RELEASE_RC" -ne 0 ]; then cat /tmp/release-error.txt || true; fi
          if [ "$TAG_RC" -ne 0 ]; then cat /tmp/tag-error.txt || true; fi

      - name: Reject published release
        if: steps.inspect.outputs.release_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(jq -r '.isDraft' /tmp/release.json)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG already exists as a published release. Refusing to modify it."
            exit 1
          fi

      - name: Create draft release on existing tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Responsive + realtime premium UI, security hardening, premium UI system, purchase cost handling, receipt print safety, and RBAC hardening included. Windows EXE and installer verified."

      - name: Create draft release with GitHub-managed tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating draft release for tag $RELEASE_TAG at target $TARGET_SHA"
          gh release create "$RELEASE_TAG" --repo "$REPO" --target "$TARGET_SHA" --draft \
            --title "WPOS PRO 2 v${RELEASE_VERSION}" \
            --notes "WPOS PRO 2 v${RELEASE_VERSION} production release. Responsive + realtime premium UI, security hardening, premium UI system, purchase cost handling, receipt print safety, and RBAC hardening included. Windows EXE and installer verified."

      - name: Upload assets to draft release
        shell: bash
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "ERROR: $RELEASE_TAG is not a draft. Refusing to upload assets."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "release-assets/WPOS_PRO_2_2.12.0.exe" \
            "release-assets/WPOS_PRO_2_Setup_2.12.0.exe" \
            "release-assets/SHA256SUMS.txt" \
            --repo "$REPO" --clobber

      - name: Verify draft assets and target
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,targetCommitish,assets)
          echo "$RELEASE_JSON"
          test "$(echo "$RELEASE_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"
          test "$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')" = "$TARGET_SHA"
          for asset in WPOS_PRO_2_2.12.0.exe WPOS_PRO_2_Setup_2.12.0.exe SHA256SUMS.txt; do
            echo "$RELEASE_JSON" | jq -r '.assets[].name' | grep -Fx "$asset"
          done

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --latest
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,targetCommitish,assets)
          echo "$RELEASE_JSON"
          test "$(echo "$RELEASE_JSON" | jq -r '.isDraft')" = "false"
          test "$(echo "$RELEASE_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"
          test "$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')" = "$TARGET_SHA"
          for asset in WPOS_PRO_2_2.12.0.exe WPOS_PRO_2_Setup_2.12.0.exe SHA256SUMS.txt; do
            echo "$RELEASE_JSON" | jq -r '.assets[].name' | grep -Fx "$asset"
          done
