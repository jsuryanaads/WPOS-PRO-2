name: WPOS PRO 2 Release Publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: V2.10.0
      TARGET_SHA: 051487b7722c1247111098e8c28567a902e798dc
      BUILD_RUN_ID: "34711848194"
      ARTIFACT_NAME: WPOS-PRO-2-2.10.0
    steps:
      - name: Download verified Windows artifact
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release-assets
          test -f "release-assets/dist/WPOS_PRO_2_2.10.0.exe"
          test -f "release-assets/installer/WPOS_PRO_2_Setup_2.10.0.exe"
          test -f "release-assets/installer/SHA256SUMS.txt"
          cp "release-assets/dist/WPOS_PRO_2_2.10.0.exe" release-assets/WPOS_PRO_2_2.10.0.exe
          cp "release-assets/installer/WPOS_PRO_2_Setup_2.10.0.exe" release-assets/WPOS_PRO_2_Setup_2.10.0.exe
          cp "release-assets/installer/SHA256SUMS.txt" release-assets/SHA256SUMS.txt

      - name: Inspect existing release and tag
        id: inspect
        shell: bash
        run: |
          set +e
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,isLatest,targetCommitish,assets >/tmp/release-view.txt 2>&1
          RELEASE_RC=$?
          gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" >/tmp/tag-view.txt 2>&1
          TAG_RC=$?
          set -e
          echo "release_rc=$RELEASE_RC"
          echo "tag_rc=$TAG_RC"
          if [ "$RELEASE_RC" -eq 0 ]; then echo "release_exists=true" >> "$GITHUB_OUTPUT"; else echo "release_exists=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$TAG_RC" -eq 0 ]; then echo "tag_exists=true" >> "$GITHUB_OUTPUT"; else echo "tag_exists=false" >> "$GITHUB_OUTPUT"; fi
          cat /tmp/release-view.txt || true
          cat /tmp/tag-view.txt || true

      - name: Upload assets to existing release
        if: steps.inspect.outputs.release_exists == 'true'
        run: |
          RELEASE_ID=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId --jq '.databaseId')
          API="https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets"
          upload_asset() {
            local file="$1"
            local name="$2"
            echo "Uploading ${name} to release ${RELEASE_ID}"
            gh api --method POST "$API" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --field name="$name" \
              --input "$file"
          }
          upload_asset "release-assets/WPOS_PRO_2_2.10.0.exe" "WPOS_PRO_2_2.10.0.exe"
          upload_asset "release-assets/WPOS_PRO_2_Setup_2.10.0.exe" "WPOS_PRO_2_Setup_2.10.0.exe"
          upload_asset "release-assets/SHA256SUMS.txt" "SHA256SUMS.txt"

      - name: Create release on existing tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists == 'true'
        run: |
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag \
            --title "WPOS PRO 2 v2.10.0" --latest \
            --notes "WPOS PRO 2 v2.10.0 production release. Pytest 132 passed; Windows EXE and installer verified." \
            release-assets/WPOS_PRO_2_2.10.0.exe \
            release-assets/WPOS_PRO_2_Setup_2.10.0.exe \
            release-assets/SHA256SUMS.txt

      - name: Create release with GitHub-managed tag
        if: steps.inspect.outputs.release_exists != 'true' && steps.inspect.outputs.tag_exists != 'true'
        run: |
          gh release create "$RELEASE_TAG" --repo "$REPO" --target "$TARGET_SHA" \
            --title "WPOS PRO 2 v2.10.0" --latest \
            --notes "WPOS PRO 2 v2.10.0 production release. Pytest 132 passed; Windows EXE and installer verified." \
            release-assets/WPOS_PRO_2_2.10.0.exe \
            release-assets/WPOS_PRO_2_Setup_2.10.0.exe \
            release-assets/SHA256SUMS.txt

      - name: Verify release and assets
        run: |
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,isLatest,targetCommitish,assets
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort | grep -Fx 'WPOS_PRO_2_2.10.0.exe'
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort | grep -Fx 'WPOS_PRO_2_Setup_2.10.0.exe'
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort | grep -Fx 'SHA256SUMS.txt'
