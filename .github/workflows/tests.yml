name: WPOS PRO Tests

# Stage 2: starts after CI Health completes. The gate fails unless CI Health succeeded.
on:
  workflow_run:
    workflows: ["WPOS PRO 2 CI Health"]
    types: [completed]
    branches: [main]

concurrency:
  group: wpos-tests-main
  cancel-in-progress: true

jobs:
  gate:
    name: Gate - CI Health must succeed
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI Health result
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "CI Health conclusion: $UPSTREAM_CONCLUSION"
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "CI Health did not succeed. Tests pipeline is stopped."
            exit 1
          fi

  test:
    name: Run Tests
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
