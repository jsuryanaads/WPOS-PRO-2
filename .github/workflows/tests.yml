name: WPOS PRO Tests

# Stage 2: starts only after CI Health completes successfully on main.
on:
  workflow_run:
    workflows: ["WPOS PRO 2 CI Health"]
    types: [completed]
    branches: [main]

concurrency:
  group: wpos-tests-main
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
