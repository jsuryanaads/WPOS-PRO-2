name: WPOS PRO 2 CI Health

on:
  push:
    branches: [main]
  workflow_dispatch:

# Stage 1: the pipeline starts here. Only one CI Health run per main ref.
# A workflow-only commit is intentionally sufficient to revalidate the current main tree.
# Revalidation marker: 2026-09-13
# GitHub Actions runtime: Node24-compatible action majors.
concurrency:
  group: wpos-ci-health-main
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
