name: WPOS PRO 2 Windows Build

# Stage 3: starts after Tests completes. The gate fails unless Tests succeeded.
on:
  workflow_run:
    workflows: ["WPOS PRO Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: wpos-windows-build-main
  cancel-in-progress: true

jobs:
  gate:
    name: Gate - Tests must succeed
    runs-on: ubuntu-latest
    steps:
      - name: Verify Tests result
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Tests conclusion: $UPSTREAM_CONCLUSION"
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "Tests did not succeed. Windows Build is stopped."
            exit 1
          fi

  build-windows:
    name: Build Windows EXE
    needs: gate
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Diagnose Windows runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Image: $env:ImageVersion"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify branding assets
        shell: pwsh
        run: |
          if (!(Test-Path "assets\branding\wpos_logo.png")) { throw "Logo tidak ditemukan: wpos_logo.png" }
          if (!(Test-Path "assets\branding\wpos_icon.ico")) { throw "Icon tidak ditemukan: wpos_icon.ico" }
          if (!(Test-Path "assets\branding\login_background.png")) { throw "Background login tidak ditemukan: login_background.png" }

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --icon "assets\branding\wpos_icon.ico" --name "WPOS PRO 2" --paths . --add-data "assets\branding\wpos_logo.png;assets\branding" --add-data "assets\branding\wpos_icon.ico;assets\branding" --add-data "assets\branding\login_background.png;assets\branding" run.py

      - name: Verify EXE and branding
        shell: pwsh
        run: |
          $exe = "dist\WPOS PRO 2\WPOS PRO 2.exe"
          $logo = "dist\WPOS PRO 2\_internal\assets\branding\wpos_logo.png"
          $icon = "dist\WPOS PRO 2\_internal\assets\branding\wpos_icon.ico"
          $background = "dist\WPOS PRO 2\_internal\assets\branding\login_background.png"
          if (!(Test-Path $exe)) { throw "EXE tidak ditemukan: $exe" }
          if (!(Test-Path $logo)) { throw "Logo tidak ikut dipaketkan: $logo" }
          if (!(Test-Path $icon)) { throw "Icon tidak ikut dipaketkan: $icon" }
          if (!(Test-Path $background)) { throw "Background login tidak ikut dipaketkan: $background" }
          Add-Type -AssemblyName System.Drawing
          $associated = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if ($null -eq $associated) { throw "EXE tidak memiliki associated icon" }
          $associated.Dispose()
          Get-Item $exe,$logo,$icon,$background | Format-List FullName,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-2-Windows
          path: dist/WPOS PRO 2/
          if-no-files-found: error
          retention-days: 14
